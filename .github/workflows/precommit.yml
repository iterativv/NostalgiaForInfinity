name: Changed Files Pre-Commit Check

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: read

env:
  PRE_COMMIT_COLOR: always

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 10
          token: ${{ github.token }}

      - name: Checkout repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - id: changed-files
        name: Determine changed files
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          token: ${{ github.token }}
          list-files: shell
          filters: |
            repo:
              - added|modified: ['**']

      - name: Generate cache key
        run: |
          echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit and apply fixes
        if: github.event_name == 'pull_request'
        run: |
          pre-commit run --files ${{ steps.changed-files.outputs.repo_files }} || true

      - name: Show changes
        if: github.event_name == 'pull_request'
        run: |
          git status --short
          git diff --stat

      - name: Commit and push fixes
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: apply pre-commit fixes"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify pre-commit
        if: github.event_name == 'pull_request'
        run: |
          pre-commit run --files ${{ steps.changed-files.outputs.repo_files }}

      - name: Run pre-commit on push
        if: github.event_name != 'pull_request'
        run: |
          pre-commit run --all-files
